version: '3.8'

services:
  flask-app:
    build: .  
    container_name: flask-app-container
    ports:
      - "5000:5000"
      - "8000:8000" 
    networks:
      - flask-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  
    networks:
      - flask-network

  cadvisor:
    image: google/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
    networks:
      - flask-network

networks:
  flask-network:
    driver: bridge  